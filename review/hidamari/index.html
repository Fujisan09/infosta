<script>
(async function () {
  const fragment=location.hash.slice(1);
  if(!/^[A-Za-z0-9_-]{43}$/.test(fragment)) return;
  const status=document.getElementById('status');
  status.textContent='確認用ページを開いています。';
  try {
    const bytes=s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
    const secret=await crypto.subtle.importKey('raw',bytes(fragment.replaceAll('-','+').replaceAll('_','/')+'='),'AES-GCM',false,['decrypt']);
    const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes('1yVRtxu8GXcyb49Z')},secret,bytes(document.getElementById('data').textContent));
    const page = new DOMParser().parseFromString(new TextDecoder().decode(html),'text/html');
    const scripts = [...page.querySelectorAll('script')].map(node => {
      const source=node.textContent;
      node.remove();
      return source;
    });
    document.documentElement.replaceWith(document.importNode(page.documentElement,true));
    for (const source of scripts) {
      const script=document.createElement('script');
      script.textContent=source;
      document.body.append(script);
    }
  } catch {status.textContent='リンクを確認できませんでした。受け取ったURLを末尾までコピーして、ブラウザで開いてください。';}
})();
</script></body></html>
